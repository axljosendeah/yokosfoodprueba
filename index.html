<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yoko’s Food | Menú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--bg:#fff;--sf:#fff;--tx:#151515;--mu:#5c5c5c;--bd:#eadfe0;--rd:#c3001f;--rt:#c3001f;--wash:#fbe6e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--sf:#1a1a1a;--tx:#f6f1f1;--mu:#b9b0b0;--bd:#2f2a2a;--rt:#ff5a70;--wash:#2a1518}}
:root[data-theme="dark"]{--bg:#101010;--sf:#1a1a1a;--tx:#f6f1f1;--mu:#b9b0b0;--bd:#2f2a2a;--rt:#ff5a70;--wash:#2a1518}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{font:500 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
:focus-visible{outline:3px solid var(--rd);outline-offset:2px}
.hero{padding:34px 20px 44px;text-align:center}
.lg{width:min(58vw,250px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--bd)}
.lg img{width:100%;height:100%;display:block}
.band{position:relative;max-width:580px;height:118px;margin:-6px auto 0;display:grid;place-items:center;padding:0 34px}
.band svg{position:absolute;inset:0;width:100%;height:100%}
.band p{position:relative;color:#fff;font:700 clamp(21px,6vw,31px)/1.15 "Shippori Mincho B1",serif}
.inf{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;color:var(--mu);font-size:15px;margin:6px 0 22px}
.btn{display:inline-block;padding:13px 28px;border-radius:8px;border:0;background:var(--rd);color:#fff;font:700 17px "Zen Kaku Gothic New",sans-serif;text-decoration:none;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:26px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.tabs::before,.tabs::after{content:"";margin:auto}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 0 11px;color:var(--mu);font:700 16px "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--rd)}
main{max-width:760px;margin:0 auto;padding:0 18px 150px}
section{scroll-margin-top:70px;padding-top:38px}
h2{font:800 clamp(29px,7vw,40px)/1.1 "Shippori Mincho B1",serif;padding-bottom:14px;position:relative}
h2::after{content:"";position:absolute;left:0;bottom:0;width:86px;height:6px;border-radius:3px;background:var(--rd);transform:skewX(-24deg)}
.note{margin-top:10px;color:var(--mu)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--bd)}
.ic{width:56px;height:56px;border-radius:50%;background:var(--wash);color:var(--rt);display:grid;place-items:center}
.ic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nm{font:700 19px/1.25 "Shippori Mincho B1",serif}
.ds{color:var(--mu);font-size:14.5px;margin-top:4px}
.ac{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:76px;text-align:right}
.pr{font:800 23px/1 "Shippori Mincho B1",serif;color:var(--rt)}
.pr small{font:700 12.5px/1.2 "Zen Kaku Gothic New",sans-serif;color:var(--mu);display:block;max-width:84px}
.add{width:44px;height:44px;border-radius:50%;border:0;background:var(--rd);color:#fff;font:700 26px/1 "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.qt{display:flex;align-items:center;gap:10px}
.qt b{min-width:16px;text-align:center}
.qt button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rd);background:none;color:var(--tx);font:700 20px/1 "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.hrs{margin-top:16px;display:grid;gap:8px;max-width:420px}
.hrs div{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
footer{max-width:760px;margin:0 auto;padding:0 18px 150px;color:var(--mu);font-size:14px;margin-top:-100px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:none;justify-content:space-between;align-items:center;max-width:560px;margin:auto;padding:14px 20px;border:0;border-radius:12px;background:var(--tx);color:var(--bg);font:700 17px "Zen Kaku Gothic New",sans-serif;cursor:pointer;box-shadow:0 8px 24px #0005}
.bar.s{display:flex}
.bar i{font-style:normal;display:inline-grid;place-items:center;min-width:26px;height:26px;margin-right:8px;border-radius:13px;background:var(--rd);color:#fff;font-size:14px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.s{display:flex}
.pn{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.pn h3{font:800 28px "Shippori Mincho B1",serif;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.ln small{color:var(--mu)}
.tt{display:flex;justify-content:space-between;font:700 20px "Zen Kaku Gothic New",sans-serif;padding:14px 0}
.md{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.md button{padding:11px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:700 16px "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.md button.on{border-color:var(--rd);background:var(--wash)}
.pn input{width:100%;padding:12px 14px;margin:6px 0 14px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);font:500 16px "Zen Kaku Gothic New",sans-serif}
.pn label{font-weight:700;font-size:15px}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act .g{background:none;border:0;color:var(--tx);font:700 16px "Zen Kaku Gothic New",sans-serif;text-decoration:underline;cursor:pointer;padding:12px}
</style>
</head>

{id:"bocados",n:"Bocados japoneses",ic:"onigiri",it:[["Onigiris","Triángulo de arroz relleno con atún, acompañado de mayonesa japonesa y salsa hoisin.",null],["Bao","Panecillo relleno de carne de res y cerdo bañados en salsa hoisin.",7]]},
{id:"fuertes",n:"Platos fuertes",ic:"plate",it:[["Gordon blue de pollo","Muslo de pollo relleno de jamón, queso mozzarella y tocineta, bañado en una salsa de champiñones. Con puré de papa y ensalada cocida.",7],["Pasta Alfredo","Tocineta, jamón, maíz y queso pecorino bañado en salsa blanca.",6]]}
];
const $=s=>document.querySelector(s),money=n=>"$"+(Number.isInteger(n)?n:n.toFixed(2).replace(".",",")),cart={},o={name:"",mode:"Delivery"};
const it=k=>{const[c,i]=k.split("-");return M[c].it[i]};
const tot=ks=>ks.reduce((a,k)=>a+cart[k]*(it(k)[2]||0),0),pend=ks=>ks.some(k=>it(k)[2]==null);
const ctl=k=>{const q=cart[k]||0;return q?`<div class="qt"><button data-a="-" data-k="${k}" aria-label="Quitar uno">−</button><b>${q}</b><button data-a="+" data-k="${k}" aria-label="Agregar uno">+</button></div>`:`<button class="add" data-a="+" data-k="${k}" aria-label="Agregar al pedido">+</button>`};
const row=(ci,ii)=>{const c=M[ci],[n,d,p]=c.it[ii],k=ci+"-"+ii;return `<article class="row" id="r${k}"><div class="ic"><svg viewBox="0 0 64 64" aria-hidden="true">${IC[c.ic]}</svg></div><div><h3 class="nm">${n}</h3><p class="ds">${d}</p></div><div class="ac"><div class="pr">${p==null?"<small>Precio por confirmar</small>":money(p)}</div><div class="cx">${ctl(k)}</div></div></article>`};
$("#menu").innerHTML=M.map((c,ci)=>`<section id="${c.id}"><h2>${c.n}</h2>${c.note?`<p class="note">${c.note}</p>`:""}${c.it.map((_,ii)=>row(ci,ii)).join("")}</section>`).join("")+`<section id="info"><h2>Horarios y pedidos</h2><div class="hrs"><div><span>Martes a viernes</span><b>12 pm – 5 pm</b></div><div><span>Sábado y domingo</span><b>12 pm – 6 pm</b></div></div><p class="note">Puerto La Cruz. Delivery y pick up. [Dirección exacta del local]</p></section>`;
const S=M.map(c=>[c.id,c.n]).concat([["info","Horarios"]]);
$("#tabs").innerHTML=S.map(([id,n])=>`<button class="tab" data-s="${id}">${n}</button>`).join("");
const msg=ks=>{const t=tot(ks);return "Hola Yoko’s Food, quiero hacer este pedido:\n"+ks.map(k=>`- ${cart[k]} x ${it(k)[0]} (${it(k)[2]==null?"precio por confirmar":money(cart[k]*it(k)[2])})`).join("\n")+"\nTotal: "+money(t)+(pend(ks)?" (más ítems por confirmar)":"")+"\nModalidad: "+o.mode+(o.name?"\nNombre: "+o.name:"")};
const link=()=>"https://wa.me/"+WA+"?text="+encodeURIComponent(msg(Object.keys(cart)));
function sheet(){const ks=Object.keys(cart),t=tot(ks);
$("#pn").innerHTML=`<h3>Mi pedido</h3>${ks.map(k=>`<div class="ln"><span>${it(k)[0]}<br><small>${it(k)[2]==null?"Precio por confirmar":money(it(k)[2])+" c/u"}</small></span><div class="qt"><button data-a="-" data-k="${k}" aria-label="Quitar uno">−</button><b>${cart[k]}</b><button data-a="+" data-k="${k}" aria-label="Agregar uno">+</button></div></div>`).join("")}<div class="tt"><span>Total</span><span>${money(t)}${pend(ks)?" + por confirmar":""}</span></div><label>¿Cómo lo recibes?</label><div class="md">${["Delivery","Pick up"].map(m=>`<button data-m="${m}" class="${o.mode===m?"on":""}">${m}</button>`).join("")}</div><label for="nm">Tu nombre</label><input id="nm" autocomplete="name" value="${o.name.replace(/"/g,"&quot;")}"><div class="act"><a class="btn" id="wa" target="_blank" rel="noopener" href="${link()}">Enviar por WhatsApp</a><button class="g" id="cl">Seguir viendo</button></div>`;
$("#cl").onclick=()=>$("#ov").classList.remove("s");
$("#nm").oninput=e=>{o.name=e.target.value.trim();$("#wa").href=link()}}
function upd(){const ks=Object.keys(cart),n=ks.reduce((a,k)=>a+cart[k],0);
$("#bar").className="bar"+(n?" s":"");$("#bar").innerHTML=`<span><i>${n}</i>Ver mi pedido</span><span>${money(tot(ks))}${pend(ks)?" +":""}</span>`;
if($("#ov").classList.contains("s"))sheet();if(!n)$("#ov").classList.remove("s")}
document.addEventListener("click",e=>{
const s=e.target.closest("[data-s]");if(s){document.getElementById(s.dataset.s).scrollIntoView();return}
const m=e.target.closest("[data-m]");if(m){o.mode=m.dataset.m;document.querySelectorAll(".md button").forEach(b=>b.classList.toggle("on",b===m));$("#wa").href=link();return}
const b=e.target.closest("[data-a]");if(!b)return;const k=b.dataset.k;cart[k]=(cart[k]||0)+(b.dataset.a==="+"?1:-1);if(cart[k]<=0)delete cart[k];
const cx=document.querySelector("#r"+k+" .cx");if(cx)cx.innerHTML=ctl(k);upd()});
$("#bar").onclick=()=>{sheet();$("#ov").classList.add("s")};
$("#ov").onclick=e=>{if(e.target.id==="ov")$("#ov").classList.remove("s")};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)document.querySelectorAll(".tab").forEach(c=>{const on=c.dataset.s===x.target.id;c.classList.toggle("on",on);if(on)c.scrollIntoView({inline:"center",block:"nearest"})})}),{rootMargin:"-35% 0px -60% 0px"});
document.querySelectorAll("section").forEach(s=>io.observe(s));
</script>
</body>
</html>
